
<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horse Racing 🐎</title>
<style>
* { box-sizing: border-box; }
body {
  background: #164b2b; color: white; font-family: Arial, sans-serif;
  text-align: center; margin: 0; padding: 20px 10px;
}
h1 { color: #ffd166; font-size: 34px; }
.panel { max-width: 1000px; margin: auto; }
.money { font-size: 25px; color: #ffd166; font-weight: bold; }
.controls {
  background: #205a35; padding: 18px; border-radius: 15px; margin: 15px auto;
}
select, input, button {
  padding: 11px; margin: 5px; border-radius: 7px; border: none; font-size: 16px;
}
button { background: #ffd166; color: #222; font-weight: bold; cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
.track-wrap {
  width: 100%; max-width: 900px; margin: 25px auto; padding: 8px;
  background: #b58b54; border: 3px solid #e3c18a; border-radius: 12px;
  box-shadow: 0 0 0 4px #8b6239; overflow: hidden;
}
.track {
  position: relative; width: 100%; aspect-ratio: 1.72 / 1;
  min-height: 245px; overflow: hidden; background: #a62b2e;
}
.track-svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; pointer-events: none;
}
.center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  color: rgba(255,255,255,.86); font-size: clamp(12px, 2vw, 20px);
  font-weight: bold; pointer-events: none; line-height: 1.5;
}
.finish {
  position: absolute; top: 7%; bottom: 7%; left: 18%; width: 12px;
  transform: translateX(-50%);
  background: repeating-conic-gradient(#fff 0% 25%, #222 0% 50%) 0 / 8px 8px;
  border-left: 1px solid white; border-right: 1px solid white;
  z-index: 3; pointer-events: none;
}
.horse {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  z-index: 5; font-size: clamp(17px, 2.5vw, 27px); white-space: nowrap;
  will-change: left, top; text-shadow: 0 1px 2px #222;
}
.horse span {
  display: inline-block; background: rgba(0,0,0,.72); color: white;
  border-radius: 5px; padding: 3px 5px; font-size: 10px; vertical-align: middle;
}
#result { min-height: 32px; color: #ffe08a; }
#status { color: #d7f5dc; }
@media (max-width: 550px) {
  body { padding: 12px 6px; }
  h1 { font-size: 27px; }
  .track-wrap { padding: 4px; }
  .track { min-height: 210px; }
  .horse span { font-size: 8px; padding: 2px 3px; }
}
</style>
</head>
<body>
<div class="panel">
  <h1>🐎 Horse Racing 🏁</h1>
  <h2 class="money">💰 Raha: $<span id="money">100</span></h2>
  <div class="controls">
    <p>Vali hobune, kes sinu arvates võidab!</p>
    <select id="horseChoice">
      <option value="0">🐎 Välk (2x)</option>
      <option value="1">🐴 Äike (3x)</option>
      <option value="2">🏇 Torm (5x)</option>
    </select>
    <p>Vali panuse suurus:</p>
    <input id="bet" type="number" min="1" step="1" value="10" placeholder="Panus $">
    <br>
    <button id="raceButton" onclick="race()">🏁 Alusta võistlust!</button>
    <button id="resetButton" onclick="resetGame()">🔄 Uus mäng</button>
  </div>
  <h3 id="result">Valmis võistluseks?</h3>
  <p id="status">Vali hobune ja vajuta alustamiseks!</p>

  <div class="track-wrap">
    <div class="track" id="track">
      <svg class="track-svg" viewBox="0 0 900 520" preserveAspectRatio="none" aria-label="Staadionikujuline jooksurada">
        <path d="M 260 55 H 640 A 205 205 0 0 1 640 465 H 260 A 205 205 0 0 1 260 55 Z" fill="#a62b2e" stroke="#f8ead7" stroke-width="5"/>
        <path d="M 260 82 H 640 A 178 178 0 0 1 640 438 H 260 A 178 178 0 0 1 260 82 Z" fill="none" stroke="#fff4e8" stroke-width="2.5"/>
        <path d="M 260 109 H 640 A 151 151 0 0 1 640 411 H 260 A 151 151 0 0 1 260 109 Z" fill="none" stroke="#fff4e8" stroke-width="2.5"/>
        <path d="M 260 136 H 640 A 124 124 0 0 1 640 384 H 260 A 124 124 0 0 1 260 136 Z" fill="none" stroke="#fff4e8" stroke-width="2.5"/>
        <path d="M 260 163 H 640 A 97 97 0 0 1 640 357 H 260 A 97 97 0 0 1 260 163 Z" fill="none" stroke="#fff4e8" stroke-width="2.5"/>
        <path d="M 450 55 V 163 M 450 357 V 465" stroke="#fff4e8" stroke-width="2.5"/>
      </svg>
      <div class="center">🏆<br>FINIŠ</div>
    </div>
  </div>
  <p>🏇 Esimene finišisse jõudnud hobune võidab!</p>
  <p id="stats">Võite: 0 | Võistlusi: 0</p>
</div>

<script>
let money = 100, wins = 0, races = 0, running = false, animation = null;

const horses = [
  { name: "Välk", emoji: "🐎", odds: 2, lane: 0, progress: 0, speed: 0 },
  { name: "Äike", emoji: "🐴", odds: 3, lane: 1, progress: 0, speed: 0 },
  { name: "Torm", emoji: "🏇", odds: 5, lane: 2, progress: 0, speed: 0 }
];
const track = document.getElementById("track");
const moneyText = document.getElementById("money");
const result = document.getElementById("result");
const status = document.getElementById("status");
const raceButton = document.getElementById("raceButton");

function createHorses() {
  horses.forEach((horse, i) => {
    const el = document.createElement("div");
    el.className = "horse";
    el.id = "horse" + i;
    el.innerHTML = horse.emoji + " <span>" + horse.name + "</span>";
    track.appendChild(el);
  });
  drawHorses();
}

/* Staadionikujuline ring: sirged ja kaks poolringikujulist kurvi. */
function stadiumPoint(progress, laneIndex) {
  const w = track.clientWidth, h = track.clientHeight;
  const scaleX = w / 900, scaleY = h / 520;
  const inset = [0, 27, 54][laneIndex];
  const left = 260, right = 640;
  const top = 55 + inset, bottom = 465 - inset;
  const radius = (bottom - top) / 2;
  const straight = right - left;
  const arcLength = Math.PI * radius;
  const total = 2 * straight + 2 * arcLength;
  let d = (((progress % 1) + 1) % 1) * total;
  let x, y;

  if (d < straight) {
    x = left + d; y = top;
  } else if ((d -= straight) < arcLength) {
    const angle = -Math.PI / 2 + d / radius;
    x = right + radius * Math.cos(angle);
    y = (top + bottom) / 2 + radius * Math.sin(angle);
  } else if ((d -= arcLength) < straight) {
    x = right - d; y = bottom;
  } else {
    d -= straight;
    const angle = Math.PI / 2 + d / radius;
    x = left + radius * Math.cos(angle);
    y = (top + bottom) / 2 + radius * Math.sin(angle);
  }
  return { x: x * scaleX, y: y * scaleY };
}

function drawHorses() {
  horses.forEach((horse, i) => {
    const el = document.getElementById("horse" + i);
    if (!el) return;
    const p = stadiumPoint(horse.progress, i);
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
  });
}

function updateUI() {
  moneyText.textContent = money;
  document.getElementById("stats").textContent =
    "Võite: " + wins + " | Võistlusi: " + races;
}

function race() {
  if (running) return;
  const bet = Number(document.getElementById("bet").value);
  const chosen = Number(document.getElementById("horseChoice").value);
  if (!Number.isFinite(bet) || bet <= 0 || !Number.isInteger(bet) || bet > money) {
    result.textContent = "Sisesta sobiv panus!";
    return;
  }

  money -= bet;
  updateUI();
  running = true;
  raceButton.disabled = true;
  document.getElementById("resetButton").disabled = true;
  document.getElementById("horseChoice").disabled = true;
  document.getElementById("bet").disabled = true;
  result.textContent = "🏁 Võistlus algab!";
  status.textContent = "Hobused jooksevad... Kes jõuab esimesena finišisse?";

  horses.forEach(h => {
    h.progress = 0;
    h.speed = 0.000055 + Math.random() * 0.000018;
  });

  let lastTime = null;
  function animate(time) {
    if (!running) return;
    if (lastTime === null) lastTime = time;
    const delta = Math.min(time - lastTime, 40);
    lastTime = time;

    horses.forEach(h => {
      if (h.progress < 1) {
        const variation = 0.85 + Math.random() * 0.3;
        h.progress = Math.min(1, h.progress + h.speed * delta * variation);
      }
    });

    drawHorses();
    const winner = horses.find(h => h.progress >= 1);
    if (winner) {
      finishRace(winner, chosen, bet);
      return;
    }
    animation = requestAnimationFrame(animate);
  }
  animation = requestAnimationFrame(animate);
}

function finishRace(winner, chosen, bet) {
  running = false;
  races++;
  horses.forEach(h => { if (h === winner) h.progress = 1; });
  drawHorses();

  if (horses.indexOf(winner) === chosen) {
    const prize = bet * winner.odds;
    money += prize;
    wins++;
    result.textContent = "🏆 " + winner.name + " võitis! Said $" + prize + "! 🎉";
    status.textContent = "Sinu valitud hobune jõudis esimesena finišisse!";
  } else {
    result.textContent = "🏁 Võitis " + winner.name + "!";
    status.textContent = "Seekord ei läinud õnneks. Sinu panus jäi kaotatuks.";
  }

  updateUI();
  raceButton.disabled = money <= 0;
  document.getElementById("resetButton").disabled = false;
  document.getElementById("horseChoice").disabled = false;
  document.getElementById("bet").disabled = false;

  if (money <= 0) status.textContent += " Raha sai otsa — alusta uut mängu.";
}

function resetGame() {
  if (running) return;
  money = 100; wins = 0; races = 0;
  horses.forEach(h => { h.progress = 0; h.speed = 0; });
  drawHorses();
  updateUI();
  result.textContent = "Valmis uueks võistluseks?";
  status.textContent = "Vali hobune ja alusta võistlust!";
  raceButton.disabled = false;
  document.getElementById("resetButton").disabled = false;
  document.getElementById("horseChoice").disabled = false;
  document.getElementById("bet").disabled = false;
}

createHorses();
updateUI();
window.addEventListener("resize", drawHorses);
</script>
</body>
</html>
