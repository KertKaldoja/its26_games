<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horse Racing 🐎</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #164b2b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px 10px;
}

h1 {
  color: #ffd166;
  font-size: 34px;
}

.panel {
  max-width: 850px;
  margin: auto;
}

.money {
  font-size: 25px;
  color: #ffd166;
  font-weight: bold;
}

.controls {
  background: #205a35;
  padding: 18px;
  border-radius: 15px;
  margin: 15px auto;
}

select, input, button {
  padding: 11px;
  margin: 5px;
  border-radius: 7px;
  border: none;
  font-size: 16px;
}

button {
  background: #ffd166;
  color: #222;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.track {
  width: 100%;
  max-width: 760px;
  height: 380px;
  margin: 25px auto;
  position: relative;
  overflow: hidden;
  background: #367b3c;
  border: 18px solid #b58b54;
  border-radius: 50%;
  box-shadow: 0 0 0 4px #e3c18a,
              inset 0 0 0 4px #e3c18a;
}

.lane {
  position: absolute;
  border: 2px dashed rgba(255,255,255,0.65);
  border-radius: 50%;
  pointer-events: none;
}

.lane1 {
  inset: 18px;
}

.lane2 {
  inset: 48px;
}

.lane3 {
  inset: 78px;
}

.center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: rgba(255,255,255,0.8);
  font-size: 22px;
  font-weight: bold;
  pointer-events: none;
}

.horse {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
  font-size: 27px;
  white-space: nowrap;
  will-change: left, top;
}

.horse span {
  display: inline-block;
  background: rgba(0,0,0,0.65);
  color: white;
  border-radius: 5px;
  padding: 3px 5px;
  font-size: 11px;
  vertical-align: middle;
}

#result {
  min-height: 32px;
  color: #ffe08a;
}

#status {
  color: #d7f5dc;
}

@media (max-width: 500px) {
  .track {
    height: 280px;
    border-width: 12px;
  }

  .lane1 { inset: 12px; }
  .lane2 { inset: 36px; }
  .lane3 { inset: 60px; }

  .horse { font-size: 21px; }
  .horse span { font-size: 9px; }
}
</style>
</head>

<body>
<div class="panel">

<h1>🐎 Horse Racing 🏁</h1>

<h2 class="money">
  💰 Raha: $<span id="money">100</span>
</h2>

<div class="controls">
  <p>Vali hobune, kes sinu arvates võidab!</p>

  <select id="horseChoice">
    <option value="0">🐎 Välk (2x)</option>
    <option value="1">🐴 Äike (3x)</option>
    <option value="2">🏇 Torm (5x)</option>
  </select>

  <p>Vali panuse suurus:</p>

  <input id="bet" type="number"
         min="1" step="1" value="10"
         placeholder="Panus $">

  <br>

  <button id="raceButton" onclick="race()">
    🏁 Alusta võistlust!
  </button>

  <button id="resetButton" onclick="resetGame()">
    🔄 Uus mäng
  </button>
</div>

<h3 id="result">Valmis võistluseks?</h3>
<p id="status">Vali hobune ja vajuta alustamiseks!</p>

<div class="track" id="track">
  <div class="lane lane1"></div>
  <div class="lane lane2"></div>
  <div class="lane lane3"></div>
  <div class="center">🏆<br>FINIŠ</div>
</div>

<p>🏇 Esimene finišisse jõudnud hobune võidab!</p>
<p id="stats">Võite: 0 | Võistlusi: 0</p>

</div>

<script>
let money = 100;
let wins = 0;
let races = 0;
let running = false;
let animation = null;

const horses = [
  {
    name: "Välk",
    emoji: "🐎",
    odds: 2,
    lane: 0,
    progress: 0,
    speed: 0
  },
  {
    name: "Äike",
    emoji: "🐴",
    odds: 3,
    lane: 1,
    progress: 0,
    speed: 0
  },
  {
    name: "Torm",
    emoji: "🏇",
    odds: 5,
    lane: 2,
    progress: 0,
    speed: 0
  }
];

const track = document.getElementById("track");
const moneyText = document.getElementById("money");
const result = document.getElementById("result");
const status = document.getElementById("status");
const raceButton = document.getElementById("raceButton");

function createHorses() {
  horses.forEach((h, i) => {
    const el = document.createElement("div");
    el.className = "horse";
    el.id = "horse" + i;
    el.innerHTML = h.emoji + " <span>" + h.name + "</span>";
    track.appendChild(el);
  });

  drawHorses();
}

function drawHorses() {
  const w = track.clientWidth;
  const h = track.clientHeight;

  horses.forEach((horse, i) => {
    const el = document.getElementById("horse" + i);

    // Iga hobune jookseb oma ovaalsel rajal.
    const rx = w * [0.43, 0.35, 0.27][i];
    const ry = h * [0.43, 0.35, 0.27][i];

    const angle =
      horse.progress * Math.PI * 2 - Math.PI / 2;

    const x = w / 2 + rx * Math.cos(angle);
    const y = h / 2 + ry * Math.sin(angle);

    el.style.left = x + "px";
    el.style.top = y + "px";
  });
}

function updateUI() {
  moneyText.textContent = money;
  document.getElementById("stats").textContent =
    "Võite: " + wins + " | Võistlusi: " + races;
}

function race() {
  if (running) return;

  const bet = Number(document.getElementById("bet").value);
  const chosen = Number(
    document.getElementById("horseChoice").value
  );

  if (!Number.isFinite(bet) ||
      bet <= 0 ||
      !Number.isInteger(bet) ||
      bet > money) {
    result.textContent = "Sisesta sobiv panus!";
    return;
  }

  money -= bet;
  updateUI();

  running = true;
  raceButton.disabled = true;
  document.getElementById("resetButton").disabled = true;
  document.getElementById("horseChoice").disabled = true;
  document.getElementById("bet").disabled = true;

  result.textContent = "🏁 Võistlus algab!";
  status.textContent = "Hobused jooksevad... Kes jõuab esimesena finišisse?";

  horses.forEach(h => {
    h.progress = 0;

    // Iga hobuse kiirus muutub võistluste vahel.
    h.speed = 0.000075 + Math.random() * 0.000035;
  });

  let lastTime = null;

  function animate(time) {
    if (!running) return;

    if (lastTime === null) lastTime = time;

    // Väldib suuri hüppeid, kui brauser hetkeks aeglustub.
    const delta = Math.min(time - lastTime, 40);
    lastTime = time;

    horses.forEach(h => {
      if (h.progress < 1) {
        // Väikesed juhuslikud kiirusemuutused.
        const variation = 0.85 + Math.random() * 0.3;
        h.progress += h.speed * delta * variation;
      }
    });

    drawHorses();

    const winner = horses.find(h => h.progress >= 1);

    if (winner) {
      finishRace(winner, chosen, bet);
      return;
    }

    requestAnimationFrame(animate);
  }

  animation = requestAnimationFrame(animate);
}

function finishRace(winner, chosen, bet) {
  running = false;
  races++;

  // Lõpeta kõik hobused ja näita tulemust alles nüüd.
  horses.forEach(h => {
    if (h === winner) h.progress = 1;
  });

  drawHorses();

  const winnerIndex = horses.indexOf(winner);

  if (winnerIndex === chosen) {
    const prize = bet * winner.odds;
    money += prize;
    wins++;

    result.textContent =
      "🏆 " + winner.name + " võitis! Said $" + prize + "! 🎉";

    status.textContent =
      "Sinu valitud hobune jõudis esimesena finishisse!";
  } else {
    result.textContent =
      "🏁 Võitis " + winner.name + "!";

    status.textContent =
      "Seekord ei läinud õnneks. Sinu panus jäi kaotatuks.";
  }

  updateUI();

  raceButton.disabled = money <= 0;
  document.getElementById("resetButton").disabled = false;
  document.getElementById("horseChoice").disabled = false;
  document.getElementById("bet").disabled = false;

  if (money <= 0) {
    status.textContent += " Raha sai otsa — alusta uut mängu.";
  }
}

function resetGame() {
  if (running) return;

  money = 100;
  wins = 0;
  races = 0;

  horses.forEach(h => {
    h.progress = 0;
    h.speed = 0;
  });

  drawHorses();
  updateUI();

  result.textContent = "Valmis uueks võistluseks?";
  status.textContent = "Vali hobune ja alusta võistlust!";

  raceButton.disabled = false;
  document.getElementById("resetButton").disabled = false;
  document.getElementById("horseChoice").disabled = false;
  document.getElementById("bet").disabled = false;
}

createHorses();
updateUI();

window.addEventListener("resize", drawHorses);
</script>
</body>
</html>
