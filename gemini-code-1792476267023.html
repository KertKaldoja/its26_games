<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Tähtede Püüdmine - Erinevad Tähed</title>
  <style>
    body {
      margin: 0;
      background: #1a1a24;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #ui {
      font-size: 20px;
      margin-bottom: 10px;
      display: flex;
      gap: 25px;
    }
    canvas {
      border: 3px solid #4e54c8;
      border-radius: 8px;
      background: #0f0f17;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div id="ui">
  <div>Skoor: <span id="score">0</span></div>
  <div>Rekord: <span id="highscore">0</span></div>
  <div>Tase: <span id="level">1</span></div>
</div>
<canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highscoreEl = document.getElementById('highscore');
  const levelEl = document.getElementById('level');

  let gameState = 'MENU';
  let score = 0;
  let level = 1;

  let highScore = localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0;
  highscoreEl.innerText = highScore;

  // 1. Mängija
  const player = {
    x: 285,
    y: 185,
    size: 30,
    speed: 5,
    color: '#00e676'
  };

  // 2. Tähe süsteem (erinevad värvid, suurused ja väärtused)
  let star = {};

  function spawnStar() {
    const rand = Math.random();
    let points, size, color;

    if (rand < 0.70) {
      // 70% tõenäosus: Tavaline täht (10p)
      points = 10;
      size = 16;
      color = '#ffea00'; // Kollane
    } else if (rand < 0.90) {
      // 20% tõenäosus: Suur täht (20p)
      points = 20;
      size = 24;
      color = '#00e5ff'; // Sinine
    } else {
      // 10% tõenäosus: Väike supertäht (30p)
      points = 30;
      size = 12;
      color = '#e040fb'; // Lilla / Roosa
    }

    star = {
      x: Math.random() * (canvas.width - size),
      y: Math.random() * (canvas.height - size),
      size: size,
      color: color,
      points: points
    };
  }

  // 3. Vaenlased
  let enemies = [];

  function createEnemy() {
    let enemyX, enemyY;
    
    do {
      enemyX = Math.random() * (canvas.width - 25);
      enemyY = Math.random() * (canvas.height - 25);
    } while (Math.hypot(enemyX - player.x, enemyY - player.y) < 120);

    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 3;

    return {
      x: enemyX,
      y: enemyY,
      size: 25,
      speedX: Math.cos(angle) * speed,
      speedY: Math.sin(angle) * speed,
      color: '#ff1744'
    };
  }

  const keys = {};

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;

    if (gameState === 'MENU' && (e.key === 'Enter' || e.key === ' ')) {
      startGame();
    }
    if (gameState === 'GAMEOVER' && (e.key === 'r' || e.key === 'R')) {
      startGame();
    }
  });

  window.addEventListener('keyup', (e) => keys[e.key] = false);

  function startGame() {
    score = 0;
    level = 1;
    scoreEl.innerText = score;
    levelEl.innerText = level;

    player.x = 285;
    player.y = 185;

    enemies = [createEnemy()];
    spawnStar();

    gameState = 'PLAYING';
  }

  function checkCollision(rect1, rect2) {
    return (
      rect1.x < rect2.x + rect2.size &&
      rect1.x + rect1.size > rect2.x &&
      rect1.y < rect2.y + rect2.size &&
      rect1.y + rect1.size > rect2.y
    );
  }

  function update() {
    if (gameState !== 'PLAYING') return;

    // Mängija liikumine
    if (keys['ArrowUp'] || keys['w']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['s']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

    // Piirde kontroll
    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    // Vaenlaste liigutamine
    enemies.forEach(enemy => {
      enemy.x += enemy.speedX;
      enemy.y += enemy.speedY;

      if (enemy.x <= 0 || enemy.x + enemy.size >= canvas.width) {
        enemy.speedX *= -1;
      }
      if (enemy.y <= 0 || enemy.y + enemy.size >= canvas.height) {
        enemy.speedY *= -1;
      }

      if (checkCollision(player, enemy)) {
        gameState = 'GAMEOVER';

        if (score > highScore) {
          highScore = score;
          localStorage.setItem('highScore', highScore);
          highscoreEl.innerText = highScore;
        }
      }
    });

    // Tähe püüdmine
    if (checkCollision(player, star)) {
      score += star.points;
      scoreEl.innerText = score;

      // Taseme tõus iga 100 punkti järel
      const newLevel = Math.floor(score / 100) + 1;
      if (newLevel > level) {
        level = newLevel;
        levelEl.innerText = level;

        enemies.push(createEnemy());

        enemies.forEach(e => {
          e.speedX *= 1.1;
          e.speedY *= 1.1;
        });
      }

      // Tekita uus suvaline täht
      spawnStar();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // PEAMENÜÜ
    if (gameState === 'MENU') {
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';

      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('TÄHTEDE PÜÜDMINE', canvas.width / 2, canvas.height / 2 - 60);

      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#ffea00';
      ctx.fillText('Kollane täht = 10p', canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = '#00e5ff';
      ctx.fillText('Sinine täht = 20p', canvas.width / 2, canvas.height / 2 + 15);
      ctx.fillStyle = '#e040fb';
      ctx.fillText('Lilla täht = 30p', canvas.width / 2, canvas.height / 2 + 40);

      ctx.fillStyle = '#00e676';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('Vajuta ENTER või SPACE alustamiseks', canvas.width / 2, canvas.height / 2 + 90);
      return;
    }

    // GAME OVER
    if (gameState === 'GAMEOVER') {
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';

      ctx.font = 'bold 32px sans-serif';
      ctx.fillText('MÄNG LÄBI!', canvas.width / 2, canvas.height / 2 - 40);

      ctx.font = '20px sans-serif';
      ctx.fillText(`Lõppskoor: ${score}  |  Tase: ${level}`, canvas.width / 2, canvas.height / 2);

      if (score === highScore && score > 0) {
        ctx.fillStyle = '#ffea00';
        ctx.fillText('UUS REKORDSKOOR!', canvas.width / 2, canvas.height / 2 + 35);
      } else {
        ctx.fillStyle = '#aaa';
        ctx.fillText(`Parim tulemus: ${highScore}`, canvas.width / 2, canvas.height / 2 + 35);
      }

      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#00e676';
      ctx.fillText('Vajuta "R" et uuesti alustada', canvas.width / 2, canvas.height / 2 + 80);
      return;
    }

    // MÄNGU SISU
    // Joonista täht
    ctx.fillStyle = star.color;
    ctx.fillRect(star.x, star.y, star.size, star.size);

    // Joonista vaenlased
    enemies.forEach(enemy => {
      ctx.fillStyle = enemy.color;
      ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
    });

    // Joonista mängija
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>

</body>
</html>
